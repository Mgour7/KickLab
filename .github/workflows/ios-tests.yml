name: KickLab iOS Build and Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and unzip KickLab package
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find . -maxdepth 1 -type f -name 'KickLab*.zip' | head -n 1)"
          if [ -z "$ZIP" ]; then
            echo "No KickLab ZIP found in repository root."
            exit 1
          fi

          echo "Using $ZIP"
          mkdir workspace
          unzip -q "$ZIP" -d workspace

          echo "Contents:"
          find workspace -maxdepth 2 -type f | head -100

      - name: Locate project root
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$(find workspace -name project.yml -print -quit | xargs dirname)"
          if [ -z "$ROOT" ]; then
            echo "project.yml not found"
            exit 1
          fi

          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Project root: $ROOT"

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Xcode version
        run: xcodebuild -version

      - name: Build and run tests
        shell: bash
        run: |
          cd "$PROJECT_ROOT"
          bash Scripts/test-ios.sh

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kicklab-ios-test-results
          path: |
            ${{ env.PROJECT_ROOT }}/build/logs
            ${{ env.PROJECT_ROOT }}/build/KickLab.xcresult
          if-no-files-found: warn
